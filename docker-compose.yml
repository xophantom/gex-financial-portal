services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gex_finance_test}
      POSTGRES_USER: ${POSTGRES_USER:-gex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gex_local_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gex}:${POSTGRES_PASSWORD:-gex_local_password}@postgres:5432/${POSTGRES_DB:-gex_finance_test}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-challenge_only_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-challenge_only_change_me_too}
      # Sem isto a data de referência vira "hoje" e "pago no mês" some do
      # dashboard — não é a conta que está errada, é a falta de configuração.
      APP_TODAY: ${APP_TODAY:-2026-09-18}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:3001
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
